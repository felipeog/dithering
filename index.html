<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/pico.min.css" />

    <title>dithering</title>
  </head>

  <body>
    <form id="form">
      <label>
        file:
        <input type="file" name="input" id="input" accept="image/*" />
      </label>

      <label>
        maxLength:
        <input type="number" name="maxLength" id="maxLength" value="256" />
      </label>

      <input type="submit" />
    </form>

    <div class="grid">
      <label>
        resizeProgress:
        <progress id="resizeProgress" max="100" value="0"></progress>
      </label>

      <label>
        ditherProgress:
        <progress id="ditherProgress" max="100" value="0"></progress>
      </label>

      <label>
        imageProgress:
        <progress id="imageProgress" max="100" value="0"></progress>
      </label>
    </div>

    <button type="button" id="download" disabled>Download</button>

    <br />

    <canvas id="canvas"></canvas>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
